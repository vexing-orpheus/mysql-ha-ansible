---
# Edit the ansible_host IPs to match your environment.
# Hostnames (db-node-1, proxy-node-1, ...) must match each host's actual
# hostname -s, since the Galera/HAProxy configs key off that name.

all:
  children:
    db_nodes:
      hosts:
        db-node-1:
          ansible_host: 10.223.16.80
        db-node-2:
          ansible_host: 10.223.16.81
        db-node-3:
          ansible_host: 10.223.16.82
    proxy_nodes:
      hosts:
        proxy-node-1:
          ansible_host: 10.223.16.83
        proxy-node-2:
          ansible_host: 10.223.16.84
    mysql_ha_cluster:
      children:
        db_nodes:
        proxy_nodes:
