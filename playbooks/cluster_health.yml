---
# =============================================================================
# cluster_health.yml — read-only health snapshot, run from the control VM:
#
#   ansible-playbook playbooks/cluster_health.yml
#
# Fails the play (non-zero exit) if any check is unhealthy, so it can be
# used in CI/cron as a gate as well as an interactive report.
# =============================================================================

- name: Collect secrets and VIP (standalone runs only)
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Determine whether this playbook is running standalone
      # True only when this playbook runs on its own — install.yml's own
      # credentials play already sets cluster_vip (and everything else below)
      # on every host by the time this play would run as part of that import.
      # Computed once into a fact (rather than a lazily re-evaluated play var)
      # because a later task in this same play sets cluster_vip via add_host,
      # which would otherwise flip this condition mid-play.
      ansible.builtin.set_fact:
        standalone_run: "{{ hostvars[groups['proxy_nodes'][0]].cluster_vip is not defined }}"

    # Each prompt below is skipped when its variable is already supplied via
    # -e (e.g. -e alert_webhook_url=... from cron), so this playbook can run
    # fully non-interactively once every needed var is passed that way.
    - name: Prompt for SSH username
      ansible.builtin.pause:
        prompt: "SSH username"
      register: p_ssh_user
      when: standalone_run and ssh_user is not defined

    - name: Prompt for SSH / sudo password
      ansible.builtin.pause:
        prompt: "SSH / sudo password (blank to use SSH keys + passwordless sudo)"
        echo: false
      register: p_ssh_pass
      when: standalone_run and ssh_pass is not defined
      no_log: true

    - name: Prompt for health-check DB username
      ansible.builtin.pause:
        prompt: "Health-check (clustercheck) DB username [clustercheck]"
      register: p_health_user
      when: standalone_run and health_user is not defined

    - name: Prompt for health-check DB password
      ansible.builtin.pause:
        prompt: "Health-check (clustercheck) DB password"
        echo: false
      register: p_health_pass
      when: standalone_run and health_pass is not defined
      no_log: true

    - name: Prompt for HAProxy stats username
      ansible.builtin.pause:
        prompt: "HAProxy stats username [haproxyadmin]"
      register: p_haproxy_stats_user
      when: standalone_run and haproxy_stats_user is not defined

    - name: Prompt for HAProxy stats password
      ansible.builtin.pause:
        prompt: "HAProxy stats password"
        echo: false
      register: p_haproxy_stats_pass
      when: standalone_run and haproxy_stats_pass is not defined
      no_log: true

    - name: Prompt for alert webhook URL
      ansible.builtin.pause:
        prompt: "Alert webhook URL (blank to disable alerts)"
      register: p_alert_webhook_url
      when: standalone_run and alert_webhook_url is not defined

    - name: Prompt for cluster VIP
      ansible.builtin.pause:
        prompt: "Cluster VIP address (used to check which proxy node currently holds it)"
      register: p_cluster_vip
      when: standalone_run and cluster_vip is not defined

    - name: Resolve effective values (-e extra-vars win over interactive prompts)
      ansible.builtin.set_fact:
        resolved_ssh_user: "{{ ssh_user | default(p_ssh_user.user_input | default('', true)) }}"
        resolved_ssh_pass: "{{ ssh_pass | default(p_ssh_pass.user_input | default('', true)) }}"
        resolved_health_user: "{{ health_user | default(p_health_user.user_input | default('clustercheck', true)) }}"
        # 'iforgottoaddapassword' fallback matches install.yml's credential
        # play (see the same literal there) — these two are real DB/HAProxy
        # account passwords, not "blank means something else" fields like
        # resolved_ssh_pass (blank = use SSH keys) or resolved_alert_webhook_url
        # (blank = alerts disabled), so blank here must resolve the same way
        # it does when the account was first created, not to a bare empty
        # string that just fails auth outright.
        resolved_health_pass: "{{ health_pass | default(p_health_pass.user_input | default('iforgottoaddapassword', true)) }}"
        resolved_haproxy_stats_user: "{{ haproxy_stats_user | default(p_haproxy_stats_user.user_input | default('haproxyadmin', true)) }}"
        resolved_haproxy_stats_pass: "{{ haproxy_stats_pass | default(p_haproxy_stats_pass.user_input | default('iforgottoaddapassword', true)) }}"
        resolved_alert_webhook_url: "{{ alert_webhook_url | default(p_alert_webhook_url.user_input | default('', true)) }}"
        resolved_cluster_vip: "{{ cluster_vip | default(p_cluster_vip.user_input | default('10.223.16.79', true)) }}"
      when: standalone_run
      no_log: true

    - name: Apply SSH credentials to every cluster host
      ansible.builtin.add_host:
        name: "{{ item }}"
        ansible_user: "{{ resolved_ssh_user }}"
        ansible_password: "{{ resolved_ssh_pass if (resolved_ssh_pass | length > 0) else omit }}"
        ansible_become_password: "{{ resolved_ssh_pass if (resolved_ssh_pass | length > 0) else omit }}"
      loop: "{{ groups['mysql_ha_cluster'] }}"
      when: standalone_run
      no_log: true

    - name: Apply health-check credentials to DB nodes
      ansible.builtin.add_host:
        name: "{{ item }}"
        health_user: "{{ resolved_health_user }}"
        health_pass: "{{ resolved_health_pass }}"
      loop: "{{ groups['db_nodes'] }}"
      when: standalone_run
      no_log: true

    - name: Apply HAProxy stats credentials and VIP to proxy nodes
      ansible.builtin.add_host:
        name: "{{ item }}"
        haproxy_stats_user: "{{ resolved_haproxy_stats_user }}"
        haproxy_stats_pass: "{{ resolved_haproxy_stats_pass }}"
        cluster_vip: "{{ resolved_cluster_vip }}"
      loop: "{{ groups['proxy_nodes'] }}"
      when: standalone_run
      no_log: true

    - name: Apply alert webhook URL to the control node
      ansible.builtin.add_host:
        name: localhost
        alert_webhook_url: "{{ resolved_alert_webhook_url }}"
      when: standalone_run
      no_log: true

- name: Determine active xtrabackup backup node (failover-aware)
  ansible.builtin.import_playbook: determine_backup_node.yml

- name: Galera cluster status
  hosts: db_nodes
  become: false
  gather_facts: false
  vars_files:
    - ../group_vars/all/01-vars.yml
  tasks:
    - name: Query wsrep local state
      community.mysql.mysql_query:
        login_user: "{{ health_user }}"
        login_password: "{{ health_pass }}"
        login_unix_socket: "{{ mysql_socket }}"
        query: "SHOW STATUS LIKE 'wsrep_local_state_comment'"
      register: wsrep_local_state
      ignore_errors: true

    - name: Query wsrep cluster status (Primary component membership)
      community.mysql.mysql_query:
        login_user: "{{ health_user }}"
        login_password: "{{ health_pass }}"
        login_unix_socket: "{{ mysql_socket }}"
        query: "SHOW STATUS LIKE 'wsrep_cluster_status'"
      register: wsrep_cluster_status
      ignore_errors: true

    - name: Query wsrep cluster size (as seen by this node)
      community.mysql.mysql_query:
        login_user: "{{ health_user }}"
        login_password: "{{ health_pass }}"
        login_unix_socket: "{{ mysql_socket }}"
        query: "SHOW STATUS LIKE 'wsrep_cluster_size'"
      register: wsrep_cluster_size
      ignore_errors: true

    - name: Query wsrep ready flag
      community.mysql.mysql_query:
        login_user: "{{ health_user }}"
        login_password: "{{ health_pass }}"
        login_unix_socket: "{{ mysql_socket }}"
        query: "SHOW STATUS LIKE 'wsrep_ready'"
      register: wsrep_ready
      ignore_errors: true

    - name: Set per-node wsrep facts (for the control node to aggregate)
      ansible.builtin.set_fact:
        node_state: "{{ wsrep_local_state.query_result[0][0].Value | default('UNREACHABLE') if wsrep_local_state is succeeded else 'UNREACHABLE' }}"
        node_cluster_status: "{{ wsrep_cluster_status.query_result[0][0].Value | default('unknown') if wsrep_cluster_status is succeeded else 'unknown' }}"
        node_cluster_size: "{{ wsrep_cluster_size.query_result[0][0].Value | default(0) if wsrep_cluster_size is succeeded else 0 }}"
        node_ready: "{{ wsrep_ready.query_result[0][0].Value | default('OFF') if wsrep_ready is succeeded else 'OFF' }}"

    - name: Report this node's Galera status
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: state={{ node_state }},
          cluster_status={{ node_cluster_status }},
          cluster_size={{ node_cluster_size }}, ready={{ node_ready }}

    - name: Report the underlying query error, if any of the wsrep queries failed
      # With ignore_errors: true (not failed_when: false — same reasoning as
      # mysql_galera/tasks/main.yml's peer-liveness check) the registered
      # results keep their real failed/msg values, so a bad health_user
      # password or an actually-unreachable node shows its real cause here
      # instead of every node just reading "UNREACHABLE" with no explanation.
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}:
          {{ [wsrep_local_state, wsrep_cluster_status, wsrep_cluster_size, wsrep_ready]
             | selectattr('failed', 'defined') | selectattr('failed')
             | map(attribute='msg') | list }}
      when: >-
        (wsrep_local_state.failed | default(false)) or
        (wsrep_cluster_status.failed | default(false)) or
        (wsrep_cluster_size.failed | default(false)) or
        (wsrep_ready.failed | default(false))

- name: Backup freshness on the active backup node
  hosts: db_nodes
  become: true
  gather_facts: false
  vars_files:
    - ../group_vars/all/01-vars.yml
  tasks:
    - name: Verify the most recent backup is within the freshness threshold
      when: inventory_hostname == (xtrabackup_active_backup_node | default(xtrabackup_backup_node, true))
      block:
        - name: Check latest backup age
          ansible.builtin.shell: |
            set -o pipefail
            latest=$(find {{ xtrabackup_repo_path }} -maxdepth 1 \( -name 'full-*' -o -name 'diff-*' \) -type d 2>/dev/null | sort | tail -1)
            [ -n "${latest}" ] && [ -f "${latest}/xtrabackup_checkpoints" ] || exit 1
            age_hours=$(( ( $(date +%s) - $(stat -c %Y "${latest}/xtrabackup_checkpoints") ) / 3600 ))
            [ "${age_hours}" -lt {{ xtrabackup_backup_freshness_hours }} ]
          register: backup_freshness_check
          changed_when: false
          failed_when: false
          args:
            executable: /bin/bash

        - name: Set backup_stale fact
          ansible.builtin.set_fact:
            backup_stale: "{{ backup_freshness_check.rc != 0 }}"

        - name: Report backup freshness
          ansible.builtin.debug:
            msg: >-
              {{ inventory_hostname }}: most recent backup is
              {{ 'STALE (older than ' ~ xtrabackup_backup_freshness_hours ~ 'h) or missing' if backup_stale else 'fresh' }}

- name: Proxy layer — HAProxy, Keepalived/VIP
  hosts: proxy_nodes
  become: false
  gather_facts: false
  vars_files:
    - ../group_vars/all/01-vars.yml
  tasks:
    - name: Check HAProxy stats
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ haproxy_stats_port }}/stats;csv"
        url_username: "{{ haproxy_stats_user }}"
        url_password: "{{ haproxy_stats_pass }}"
        return_content: true
        status_code: 200
      register: haproxy_stats
      failed_when: false

    - name: Count UP write backends
      ansible.builtin.set_fact:
        write_backends_up: >-
          {{ (haproxy_stats.content | default('') | regex_findall('mysql_write,[^\n]*,UP,')) | length }}
      when: haproxy_stats is succeeded

    - name: Report HAProxy write backends
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: write backends UP = {{ write_backends_up | default('unknown') }}"

    - name: Check whether this node currently holds the VIP
      ansible.builtin.command: ip addr show
      register: ip_addr_out
      changed_when: false

    - name: Report VIP holder
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}:
          {{ 'HOLDS VIP (' ~ cluster_vip ~ ')' if cluster_vip in ip_addr_out.stdout else 'backup' }}

- name: Disk usage on DB nodes
  hosts: db_nodes
  become: false
  gather_facts: false
  vars_files:
    - ../group_vars/all/01-vars.yml
  tasks:
    - name: Check MySQL data directory usage
      ansible.builtin.shell: df -h {{ mysql_data_dir }} | tail -1
      register: disk_usage
      changed_when: false

    - name: Report disk usage
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ disk_usage.stdout }}"

- name: Exit maintenance mode (re-enable service-down alerts now health checks are done)
  # Mirrors roles/common's "Enter maintenance mode" (the first thing that
  # runs on every host at the start of install.yml) — removing this marker
  # is what lets mysql/haproxy/keepalived/xinetd's ExecStopPost alert hooks
  # fire again for a genuinely unexpected stop, rather than staying silenced
  # from this run's own deliberate config-apply restarts. Runs even when
  # cluster_health.yml is invoked standalone (not via install.yml) — the
  # marker just won't have existed in that case, and removing a nonexistent
  # file is a no-op.
  hosts: mysql_ha_cluster
  become: true
  gather_facts: false
  vars_files:
    - ../group_vars/all/01-vars.yml
  tasks:
    - name: Remove the maintenance marker
      ansible.builtin.file:
        path: "{{ mysql_ha_silence_dir }}/maintenance"
        state: absent

- name: Aggregate results, alert, and gate on cluster health
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../group_vars/all/01-vars.yml
  tasks:
    - name: Count nodes fully in the Primary component and ready
      # map('extract', hostvars, 'node_cluster_status') does a hard
      # hostvars[item]['node_cluster_status'] lookup with no fallback — a
      # node that dropped out of an earlier play this run (e.g. unreachable,
      # or failed a prior task) never got its "Set per-node wsrep facts" task
      # to run, so the key is simply absent and extract() blows up instead of
      # letting this health check report the node as unhealthy. Extract the
      # per-host vars dict first, then map the attribute with a default.
      ansible.builtin.set_fact:
        healthy_count: >-
          {{ groups['db_nodes']
             | map('extract', hostvars)
             | map(attribute='node_cluster_status', default='unknown')
             | select('equalto', 'Primary')
             | list | length }}
        synced_count: >-
          {{ groups['db_nodes']
             | map('extract', hostvars)
             | map(attribute='node_state', default='UNREACHABLE')
             | select('equalto', 'Synced')
             | list | length }}

    - name: Start with an empty problem list
      ansible.builtin.set_fact:
        health_problems: []

    - name: Flag unreachable nodes
      ansible.builtin.set_fact:
        health_problems: "{{ health_problems + [item ~ ': wsrep state UNREACHABLE'] }}"
      loop: "{{ groups['db_nodes'] }}"
      when: hostvars[item].node_state | default('UNREACHABLE') == 'UNREACHABLE'

    - name: Flag nodes outside the Primary component
      ansible.builtin.set_fact:
        health_problems: "{{ health_problems + [item ~ ': wsrep_cluster_status=' ~ hostvars[item].node_cluster_status ~ ' (expected Primary — possible partition/split-brain)'] }}"
      loop: "{{ groups['db_nodes'] }}"
      when: >-
        hostvars[item].node_state | default('UNREACHABLE') != 'UNREACHABLE' and
        hostvars[item].node_cluster_status | default('unknown') != 'Primary'

    - name: Flag nodes not yet Synced (e.g. mid-SST as a donor or joiner)
      ansible.builtin.set_fact:
        health_problems: "{{ health_problems + [item ~ ': wsrep state is ' ~ hostvars[item].node_state ~ ' (not Synced)'] }}"
      loop: "{{ groups['db_nodes'] }}"
      when: >-
        hostvars[item].node_state | default('UNREACHABLE') not in ['UNREACHABLE', 'Synced']

    - name: Flag that no db node was reachable to run/verify backups at all
      # Without this, an unreachable backup node leaves backup_stale unset on
      # every host, and the next task's `default(false)` would silently read
      # that as "not stale" instead of "unknown" — a fully-dead backup tier
      # would report healthy. xtrabackup_active_backup_node is set by
      # playbooks/determine_backup_node.yml, imported earlier in this file.
      ansible.builtin.set_fact:
        health_problems: "{{ health_problems + ['xtrabackup: no db_nodes reachable — cannot run or verify backups this cycle'] }}"
      when: (xtrabackup_active_backup_node | default('')) | length == 0

    - name: Flag a stale or missing backup on the active backup node
      ansible.builtin.set_fact:
        health_problems: "{{ health_problems + [item ~ ' (active backup node): most recent backup is stale or missing (older than ' ~ xtrabackup_backup_freshness_hours ~ 'h)'] }}"
      loop: "{{ groups['db_nodes'] }}"
      when:
        - (xtrabackup_active_backup_node | default('')) | length > 0
        - hostvars[item].backup_stale | default(false)

    - name: Flag no HAProxy write backends up
      ansible.builtin.set_fact:
        health_problems: "{{ health_problems + [item ~ ': no HAProxy write backends UP'] }}"
      loop: "{{ groups['proxy_nodes'] }}"
      when: >-
        hostvars[item].haproxy_stats is succeeded and
        (hostvars[item].write_backends_up | default(0) | int) == 0

    - name: Report final health summary
      ansible.builtin.debug:
        msg: "{{ health_problems if health_problems | length > 0 else ['All checks healthy'] }}"

    - name: Send a consolidated alert if any problems were found
      # alert_webhook_format picks the payload shape — see the note in
      # group_vars/all/01-vars.yml. "teams" builds a MessageCard object;
      # anything else (default "simple") keeps the flat {key: message} object
      # alert.sh.j2's cron-side alerts already use, for Slack/Discord.
      ansible.builtin.uri:
        url: "{{ alert_webhook_url }}"
        method: POST
        body_format: json
        body: >-
          {{
            {"@type": "MessageCard", "@context": "https://schema.org/extensions",
             "summary": "mysql-ha-cluster health check failed",
             "themeColor": "FF0000",
             "title": "mysql-ha-cluster health check failed",
             "text": (health_problems | join('\n'))}
            if alert_webhook_format == 'teams' else
            {alert_webhook_payload_key: ('mysql-ha-cluster health check failed:\n' ~ (health_problems | join('\n')))}
          }}
        status_code: [200, 204]
      when: health_problems | length > 0
      failed_when: false

    - name: Warn if fewer than 3 nodes are Synced
      ansible.builtin.debug:
        msg: "WARNING: only {{ synced_count }} of {{ groups['db_nodes'] | length }} node(s) are Synced"
      when: synced_count | int < (groups['db_nodes'] | length)

    - name: Assert full cluster membership (every DB node in the Primary component)
      ansible.builtin.assert:
        that: healthy_count | int == (groups['db_nodes'] | length)
        fail_msg: >-
          Expected all {{ groups['db_nodes'] | length }} DB nodes in the Primary
          component, found {{ healthy_count }} (partition or outage).
        success_msg: "Cluster membership OK: {{ healthy_count }}/{{ groups['db_nodes'] | length }}"
