---
# =============================================================================
# cluster_health.yml — read-only health snapshot, run from the control VM:
#
#   ansible-playbook playbooks/cluster_health.yml
#
# Fails the play (non-zero exit) if any check is unhealthy, so it can be
# used in CI/cron as a gate as well as an interactive report.
# =============================================================================

- name: Collect secrets and VIP (standalone runs only)
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Determine whether this playbook is running standalone
      # True only when this playbook runs on its own — install.yml's own
      # credentials play already sets cluster_vip (and everything else below)
      # on every host by the time this play would run as part of that import.
      # Computed once into a fact (rather than a lazily re-evaluated play var)
      # because a later task in this same play sets cluster_vip via add_host,
      # which would otherwise flip this condition mid-play.
      ansible.builtin.set_fact:
        standalone_run: "{{ hostvars[groups['proxy_nodes'][0]].cluster_vip is not defined }}"

    # Each prompt below is skipped when its variable is already supplied via
    # -e (e.g. -e alert_webhook_url=... from cron), so this playbook can run
    # fully non-interactively once every needed var is passed that way.
    - name: Prompt for SSH username
      ansible.builtin.pause:
        prompt: "SSH username"
      register: p_ssh_user
      when: standalone_run and ssh_user is not defined

    - name: Prompt for SSH / sudo password
      ansible.builtin.pause:
        prompt: "SSH / sudo password (blank to use SSH keys + passwordless sudo)"
        echo: false
      register: p_ssh_pass
      when: standalone_run and ssh_pass is not defined
      no_log: true

    - name: Prompt for health-check DB username
      ansible.builtin.pause:
        prompt: "Health-check DB username [pgchecker]"
      register: p_health_user
      when: standalone_run and health_user is not defined

    - name: Prompt for health-check DB password
      ansible.builtin.pause:
        prompt: "Health-check DB password"
        echo: false
      register: p_health_pass
      when: standalone_run and health_pass is not defined
      no_log: true

    - name: Prompt for HAProxy stats username
      ansible.builtin.pause:
        prompt: "HAProxy stats username [haproxyadmin]"
      register: p_haproxy_stats_user
      when: standalone_run and haproxy_stats_user is not defined

    - name: Prompt for HAProxy stats password
      ansible.builtin.pause:
        prompt: "HAProxy stats password"
        echo: false
      register: p_haproxy_stats_pass
      when: standalone_run and haproxy_stats_pass is not defined
      no_log: true

    - name: Prompt for alert webhook URL
      ansible.builtin.pause:
        prompt: "Alert webhook URL (blank to disable alerts)"
      register: p_alert_webhook_url
      when: standalone_run and alert_webhook_url is not defined

    - name: Prompt for cluster VIP
      ansible.builtin.pause:
        prompt: "Cluster VIP address (used to check which proxy node currently holds it)"
      register: p_cluster_vip
      when: standalone_run and cluster_vip is not defined

    - name: Resolve effective values (-e extra-vars win over interactive prompts)
      ansible.builtin.set_fact:
        resolved_ssh_user: "{{ ssh_user | default(p_ssh_user.user_input | default('', true)) }}"
        resolved_ssh_pass: "{{ ssh_pass | default(p_ssh_pass.user_input | default('', true)) }}"
        resolved_health_user: "{{ health_user | default(p_health_user.user_input | default('pgchecker', true)) }}"
        resolved_health_pass: "{{ health_pass | default(p_health_pass.user_input | default('', true)) }}"
        resolved_haproxy_stats_user: "{{ haproxy_stats_user | default(p_haproxy_stats_user.user_input | default('haproxyadmin', true)) }}"
        resolved_haproxy_stats_pass: "{{ haproxy_stats_pass | default(p_haproxy_stats_pass.user_input | default('', true)) }}"
        resolved_alert_webhook_url: "{{ alert_webhook_url | default(p_alert_webhook_url.user_input | default('', true)) }}"
        resolved_cluster_vip: "{{ cluster_vip | default(p_cluster_vip.user_input | default('10.223.16.79', true)) }}"
      when: standalone_run
      no_log: true

    - name: Apply SSH credentials to every cluster host
      ansible.builtin.add_host:
        name: "{{ item }}"
        ansible_user: "{{ resolved_ssh_user }}"
        ansible_password: "{{ resolved_ssh_pass if (resolved_ssh_pass | length > 0) else omit }}"
        ansible_become_password: "{{ resolved_ssh_pass if (resolved_ssh_pass | length > 0) else omit }}"
      loop: "{{ groups['pg_ha_cluster'] }}"
      when: standalone_run
      no_log: true

    - name: Apply health-check credentials to DB nodes
      ansible.builtin.add_host:
        name: "{{ item }}"
        health_user: "{{ resolved_health_user }}"
        health_pass: "{{ resolved_health_pass }}"
      loop: "{{ groups['db_nodes'] }}"
      when: standalone_run
      no_log: true

    - name: Apply HAProxy stats credentials and VIP to proxy nodes
      ansible.builtin.add_host:
        name: "{{ item }}"
        haproxy_stats_user: "{{ resolved_haproxy_stats_user }}"
        haproxy_stats_pass: "{{ resolved_haproxy_stats_pass }}"
        cluster_vip: "{{ resolved_cluster_vip }}"
      loop: "{{ groups['proxy_nodes'] }}"
      when: standalone_run
      no_log: true

    - name: Apply alert webhook URL to the control node
      ansible.builtin.add_host:
        name: localhost
        alert_webhook_url: "{{ resolved_alert_webhook_url }}"
      when: standalone_run
      no_log: true

- name: Patroni cluster status
  hosts: db_nodes
  become: false
  gather_facts: false
  vars_files:
    - ../group_vars/all/01-vars.yml
  tasks:
    - name: Query Patroni REST API
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ patroni_api_port }}/patroni"
        return_content: true
        status_code: 200
      register: patroni_status
      failed_when: false

    - name: Report role
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}:
          {{ patroni_status.json.role | default('UNREACHABLE') }}

    - name: Collect roles on the control node
      ansible.builtin.set_fact:
        node_role: "{{ patroni_status.json.role | default('unreachable') }}"

    - name: Check WAL archiver failures
      community.postgresql.postgresql_query:
        login_user: "{{ health_user }}"
        login_password: "{{ health_pass }}"
        login_host: 127.0.0.1
        login_port: "{{ pg_port }}"
        db: postgres
        query: "SELECT failed_count, last_archived_time, last_failed_time FROM pg_stat_archiver"
      register: archiver_status
      failed_when: false

    - name: Set archiver_failed_count fact
      ansible.builtin.set_fact:
        archiver_failed_count: "{{ archiver_status.query_result[0].failed_count | default(0) if archiver_status is succeeded else 0 }}"

    - name: Report WAL archiver status
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: WAL archiver failed_count={{ archiver_failed_count }},
          last_archived={{ archiver_status.query_result[0].last_archived_time | default('never') if archiver_status is succeeded else 'UNKNOWN' }}

    - name: Check pgbackrest backup freshness (current primary only)
      when: node_role in ['master', 'primary']
      block:
        - name: Verify the most recent backup is within the freshness threshold
          ansible.builtin.shell: |
            set -o pipefail
            latest=$(pgbackrest --stanza={{ patroni_scope }} info --output=json | jq -r '.[0].backup[-1].timestamp.stop // 0')
            now=$(date +%s)
            age_hours=$(( (now - latest) / 3600 ))
            [ "${latest}" -gt 0 ] && [ "${age_hours}" -lt {{ pgbackrest_backup_freshness_hours }} ]
          register: backup_freshness_check
          become: true
          become_user: postgres
          changed_when: false
          failed_when: false
          args:
            executable: /bin/bash

        - name: Set backup_stale fact
          ansible.builtin.set_fact:
            backup_stale: "{{ backup_freshness_check.rc != 0 }}"

        - name: Report backup freshness
          ansible.builtin.debug:
            msg: >-
              {{ inventory_hostname }}: most recent backup is
              {{ 'STALE (older than ' ~ pgbackrest_backup_freshness_hours ~ 'h) or missing' if backup_stale else 'fresh' }}

- name: etcd cluster health
  hosts: db_nodes
  become: false
  gather_facts: false
  vars_files:
    - ../group_vars/all/01-vars.yml
  tasks:
    - name: etcd endpoint health
      ansible.builtin.command: >
        etcdctl --endpoints=http://127.0.0.1:{{ etcd_client_port }} endpoint health
      environment:
        ETCDCTL_API: "3"
      register: etcd_health
      changed_when: false
      failed_when: false

    - name: Report etcd health
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ 'healthy' if etcd_health.rc == 0 else 'UNHEALTHY' }}"

- name: Proxy layer — PgBouncer, HAProxy, Keepalived/VIP
  hosts: proxy_nodes
  become: false
  gather_facts: false
  vars_files:
    - ../group_vars/all/01-vars.yml
  tasks:
    - name: Check PgBouncer is listening
      ansible.builtin.wait_for:
        port: "{{ pgbouncer_port }}"
        host: 127.0.0.1
        timeout: 3
      register: pgbouncer_check
      failed_when: false

    - name: Report PgBouncer
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: PgBouncer {{ 'UP' if pgbouncer_check is succeeded else 'DOWN' }}"

    - name: Check HAProxy stats
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ haproxy_stats_port }}/stats;csv"
        url_username: "{{ haproxy_stats_user }}"
        url_password: "{{ haproxy_stats_pass }}"
        return_content: true
        status_code: 200
      register: haproxy_stats
      failed_when: false

    - name: Count UP write backends
      ansible.builtin.set_fact:
        write_backends_up: >-
          {{ (haproxy_stats.content | default('') | regex_findall('postgresql_primary,[^\n]*,UP,')) | length }}
      when: haproxy_stats is succeeded

    - name: Report HAProxy write backends
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: write backends UP = {{ write_backends_up | default('unknown') }}"

    - name: Check whether this node currently holds the VIP
      ansible.builtin.command: ip addr show
      register: ip_addr_out
      changed_when: false

    - name: Report VIP holder
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}:
          {{ 'HOLDS VIP (' ~ cluster_vip ~ ')' if cluster_vip in ip_addr_out.stdout else 'backup' }}

- name: Disk usage on DB nodes
  hosts: db_nodes
  become: false
  gather_facts: false
  tasks:
    - name: Check /var/lib/postgresql usage
      ansible.builtin.shell: df -h /var/lib/postgresql | tail -1
      register: disk_usage
      changed_when: false

    - name: Report disk usage
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ disk_usage.stdout }}"

- name: Aggregate results, alert, and gate on cluster health
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../group_vars/all/01-vars.yml
  tasks:
    - name: Count primaries and replicas
      ansible.builtin.set_fact:
        primary_count: >-
          {{ groups['db_nodes']
             | map('extract', hostvars, 'node_role')
             | select('in', ['master', 'primary'])
             | list | length }}
        replica_count: >-
          {{ groups['db_nodes']
             | map('extract', hostvars, 'node_role')
             | select('in', ['replica', 'standby'])
             | list | length }}

    - name: Start with an empty problem list
      ansible.builtin.set_fact:
        health_problems: []

    - name: Flag unreachable or missing Patroni roles
      ansible.builtin.set_fact:
        health_problems: "{{ health_problems + [item ~ ': Patroni role UNREACHABLE'] }}"
      loop: "{{ groups['db_nodes'] }}"
      when: hostvars[item].node_role | default('unreachable') == 'unreachable'

    - name: Flag wrong primary count
      ansible.builtin.set_fact:
        health_problems: "{{ health_problems + ['Expected exactly 1 Patroni primary, found ' ~ primary_count ~ ' (split-brain or full outage)'] }}"
      when: primary_count | int != 1

    - name: Flag etcd member health
      ansible.builtin.set_fact:
        health_problems: "{{ health_problems + [item ~ ': etcd UNHEALTHY'] }}"
      loop: "{{ groups['db_nodes'] }}"
      when: (hostvars[item].etcd_health.rc | default(1)) != 0

    - name: Flag WAL archiving failures
      ansible.builtin.set_fact:
        health_problems: "{{ health_problems + [item ~ ': WAL archiving has ' ~ (hostvars[item].archiver_failed_count | default(0)) ~ ' failed attempt(s)'] }}"
      loop: "{{ groups['db_nodes'] }}"
      when: (hostvars[item].archiver_failed_count | default(0) | int) > 0

    - name: Flag a stale or missing backup on the current primary
      ansible.builtin.set_fact:
        health_problems: "{{ health_problems + [item ~ ': most recent backup is stale or missing (older than ' ~ pgbackrest_backup_freshness_hours ~ 'h)'] }}"
      loop: "{{ groups['db_nodes'] }}"
      when: hostvars[item].backup_stale | default(false)

    - name: Flag PgBouncer down
      ansible.builtin.set_fact:
        health_problems: "{{ health_problems + [item ~ ': PgBouncer DOWN'] }}"
      loop: "{{ groups['proxy_nodes'] }}"
      when: hostvars[item].pgbouncer_check is not succeeded

    - name: Flag no HAProxy write backends up
      ansible.builtin.set_fact:
        health_problems: "{{ health_problems + [item ~ ': no HAProxy write backends UP'] }}"
      loop: "{{ groups['proxy_nodes'] }}"
      when: >-
        hostvars[item].haproxy_stats is succeeded and
        (hostvars[item].write_backends_up | default(0) | int) == 0

    - name: Report final health summary
      ansible.builtin.debug:
        msg: "{{ health_problems if health_problems | length > 0 else ['All checks healthy'] }}"

    - name: Send a consolidated alert if any problems were found
      ansible.builtin.uri:
        url: "{{ alert_webhook_url }}"
        method: POST
        body_format: json
        body: >-
          {{ {alert_webhook_payload_key: ('pg-ha-cluster health check failed:\n' ~ (health_problems | join('\n')))} }}
        status_code: [200, 204]
      when: health_problems | length > 0
      failed_when: false

    - name: Warn if fewer than 2 replicas
      ansible.builtin.debug:
        msg: "WARNING: only {{ replica_count }} healthy replica(s), expected 2"
      when: replica_count | int < 2

    - name: Assert exactly one primary
      ansible.builtin.assert:
        that: primary_count | int == 1
        fail_msg: "Expected exactly 1 Patroni primary, found {{ primary_count }} (split-brain or full outage)."
        success_msg: "Primary count OK: {{ primary_count }}"
