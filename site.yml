---
# =============================================================================
# site.yml — builds the whole PostgreSQL HA cluster from scratch, run from a
# separate Ansible control VM.
#
#   ansible-playbook site.yml
#
# No flags needed and nothing is stored on disk: every credential (SSH login,
# PostgreSQL/PgBouncer/HAProxy/keepalived service accounts, the alert
# webhook) is prompted for interactively by the first play below and applied
# to every host for the rest of the run.
#
# Order matters:
#   0. Collect connection credentials — prompts once, applies to every host
#   1. common       — OS prep on every node (parallel)
#   2. etcd         — 3-node etcd cluster on db_nodes (parallel, static bootstrap)
#   3. postgresql_patroni — one DB node at a time (serial: 1) so pg-node-1
#                     deterministically becomes primary before the others
#                     start and clone as replicas
#   4. pgbackrest   — WAL archiving, backup/check/restore-verify cron on
#                     db_nodes (parallel). archive_command was already set
#                     in step 3's patroni.yml, so there's a brief harmless
#                     window between Patroni starting and this step
#                     installing pgbackrest where WAL archiving attempts
#                     fail — it self-heals as soon as this step finishes.
#   5. pgbouncer + haproxy_keepalived — both proxy nodes (parallel)
#   6. cluster_health — read-only post-build gate; fails the run if the
#                     Patroni primary count is wrong or a service is down
# =============================================================================

- name: Collect connection credentials and cluster secrets
  hosts: localhost
  connection: local
  gather_facts: false
  vars_prompt:
    - name: ssh_user
      prompt: "SSH username"
      private: false
    - name: ssh_pass
      prompt: "SSH / sudo password (blank to use SSH keys + passwordless sudo)"
      private: true
    - name: cluster_vip
      prompt: "Cluster VIP address (floats between proxy nodes via keepalived)"
      private: false
      default: "10.223.16.79"
    - name: app_network
      prompt: "App network CIDR (allowed to reach PgBouncer/HAProxy)"
      private: false
      default: "10.223.16.0/24"
    - name: ops_network
      prompt: "Ops network CIDR (allowed to reach HAProxy stats)"
      private: false
      default: "10.223.16.0/24"
    - name: repl_user
      prompt: "PostgreSQL replication username"
      private: false
      default: "replicator"
    - name: repl_password
      prompt: "PostgreSQL replication password"
      private: true
    - name: patroni_super_user
      prompt: "PostgreSQL superuser username"
      private: false
      default: "postgres"
    - name: patroni_super_pass
      prompt: "PostgreSQL superuser password"
      private: true
    - name: patroni_rewind_user
      prompt: "pg_rewind username"
      private: false
      default: "rewind_user"
    - name: patroni_rewind_pass
      prompt: "pg_rewind password"
      private: true
    - name: health_user
      prompt: "Health-check DB username"
      private: false
      default: "pgchecker"
    - name: health_pass
      prompt: "Health-check DB password"
      private: true
    - name: app_db
      prompt: "Application database name"
      private: false
      default: "appdb"
    - name: app_db_user
      prompt: "Application database username"
      private: false
      default: "appuser"
    - name: app_db_pass
      prompt: "Application database password"
      private: true
    - name: pcp_user
      prompt: "PgBouncer admin username"
      private: false
      default: "pgbounceradmin"
    - name: pcp_pass
      prompt: "PgBouncer admin password"
      private: true
    - name: haproxy_stats_user
      prompt: "HAProxy stats username"
      private: false
      default: "haproxyadmin"
    - name: haproxy_stats_pass
      prompt: "HAProxy stats password"
      private: true
    - name: vrrp_auth_pass
      prompt: "VRRP (keepalived) authentication password"
      private: true
    - name: alert_webhook_url
      prompt: "Alert webhook URL (blank to disable alerts)"
      private: false
  tasks:
    - name: Apply credentials, secrets, and network settings to every cluster host
      ansible.builtin.add_host:
        name: "{{ item }}"
        ansible_user: "{{ ssh_user }}"
        ansible_password: "{{ ssh_pass if ssh_pass | length > 0 else omit }}"
        ansible_become_password: "{{ ssh_pass if ssh_pass | length > 0 else omit }}"
        cluster_vip: "{{ cluster_vip }}"
        app_network: "{{ app_network }}"
        ops_network: "{{ ops_network }}"
        repl_user: "{{ repl_user }}"
        repl_password: "{{ repl_password }}"
        patroni_super_user: "{{ patroni_super_user }}"
        patroni_super_pass: "{{ patroni_super_pass }}"
        patroni_rewind_user: "{{ patroni_rewind_user }}"
        patroni_rewind_pass: "{{ patroni_rewind_pass }}"
        health_user: "{{ health_user }}"
        health_pass: "{{ health_pass }}"
        app_db: "{{ app_db }}"
        app_db_user: "{{ app_db_user }}"
        app_db_pass: "{{ app_db_pass }}"
        pcp_user: "{{ pcp_user }}"
        pcp_pass: "{{ pcp_pass }}"
        haproxy_stats_user: "{{ haproxy_stats_user }}"
        haproxy_stats_pass: "{{ haproxy_stats_pass }}"
        vrrp_auth_pass: "{{ vrrp_auth_pass }}"
        alert_webhook_url: "{{ alert_webhook_url }}"
      loop: "{{ groups['pg_ha_cluster'] }}"
      loop_control:
        label: "{{ item }}"
      no_log: true

    - name: Apply alert webhook URL to the control node (for cluster_health.yml's own alert task)
      ansible.builtin.add_host:
        name: localhost
        alert_webhook_url: "{{ alert_webhook_url }}"
      no_log: true

- name: OS preparation — every node
  hosts: pg_ha_cluster
  become: true
  roles:
    - common

- name: etcd cluster — DB nodes
  hosts: db_nodes
  become: true
  roles:
    - etcd

- name: PostgreSQL + Patroni — DB nodes (one at a time, pg-node-1 first)
  hosts: db_nodes
  become: true
  serial: 1
  roles:
    - postgresql_patroni

- name: Backups, WAL archiving, restore verification — DB nodes
  hosts: db_nodes
  become: true
  roles:
    - pgbackrest

- name: Connection pooling and load balancing — proxy nodes
  hosts: proxy_nodes
  become: true
  roles:
    - pgbouncer
    - haproxy_keepalived

- name: Post-build health check
  ansible.builtin.import_playbook: playbooks/cluster_health.yml
