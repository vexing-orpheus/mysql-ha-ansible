---
# =============================================================================
# etcd — installs and statically bootstraps a 3-node etcd cluster.
# Because the full member list is known up front from the inventory, all
# three nodes are configured with initial-cluster-state=new and started
# together, rather than sequentially bootstrap-then-join.
# =============================================================================

- name: Install etcd from apt (PGDG/Ubuntu universe)
  ansible.builtin.apt:
    name:
      - etcd-server
      - etcd-client
    state: present

- name: Stop and disable the distro-default etcd instance
  ansible.builtin.systemd:
    name: etcd
    state: stopped
    enabled: false
  failed_when: false

- name: Create etcd system user
  ansible.builtin.user:
    name: etcd
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create etcd directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: etcd
    group: etcd
    mode: "0700"
  loop:
    - "{{ etcd_data_dir }}"
    - /etc/etcd

- name: Write etcd configuration
  ansible.builtin.template:
    src: etcd.conf.yml.j2
    dest: /etc/etcd/etcd.conf.yml
    owner: root
    group: etcd
    mode: "0640"
  notify: restart etcd

- name: Install etcd systemd unit
  ansible.builtin.template:
    src: etcd.service.j2
    dest: /etc/systemd/system/etcd.service
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd for etcd

- name: Flush handlers so config/unit changes land before we start the cluster
  ansible.builtin.meta: flush_handlers

- name: Enable and start etcd on every DB node
  ansible.builtin.systemd:
    name: etcd
    enabled: true
    state: started

- name: Wait for local etcd member to report healthy
  ansible.builtin.command: >
    etcdctl --endpoints=http://127.0.0.1:{{ etcd_client_port }} endpoint health
  environment:
    ETCDCTL_API: "3"
  register: etcd_health
  until: etcd_health.rc == 0
  retries: "{{ etcd_health_retries }}"
  delay: "{{ etcd_health_delay }}"
  changed_when: false

- name: Report etcd cluster member list (from pg-node-1 only)
  ansible.builtin.command: >
    etcdctl --endpoints=http://127.0.0.1:{{ etcd_client_port }} member list -w table
  environment:
    ETCDCTL_API: "3"
  register: etcd_members
  changed_when: false
  when: inventory_hostname == groups['db_nodes'][0]

- name: Show etcd member list
  ansible.builtin.debug:
    msg: "{{ etcd_members.stdout_lines }}"
  when: inventory_hostname == groups['db_nodes'][0]
