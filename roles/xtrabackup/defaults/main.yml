---
# xtrabackup_repo_path lives in group_vars/all/01-vars.yml, not here — see
# the note near xtrabackup_backup_freshness_hours there.
xtrabackup_log_path:    /var/log/xtrabackup
xtrabackup_scripts_dir: /usr/local/lib/xtrabackup-scripts

# Retention — full backup sets kept (each full-* dir plus the diff-* dirs
# taken against it).
xtrabackup_retention_full: 4

# Cron schedules (minute hour dom month dow). Defaults: full backup Sunday
# 01:00, diff backup daily (except Sunday) 01:00, integrity check daily
# 05:00, full restore-verify weekly Sunday 03:00.
xtrabackup_full_backup_cron:
  minute: "0"
  hour: "1"
  weekday: "0"
xtrabackup_diff_backup_cron:
  minute: "0"
  hour: "1"
  weekday: "1-6"
xtrabackup_check_cron:
  minute: "0"
  hour: "5"
xtrabackup_restore_verify_cron:
  minute: "0"
  hour: "3"
  weekday: "0"

# Scratch location/port used by the weekly restore-verify test — never
# touches the real data directory or port.
xtrabackup_restore_verify_path: /var/lib/xtrabackup_restore_test
xtrabackup_restore_verify_port: 5555

# Scratch location/port used by playbooks/pitr_restore.yml (pitr_restore.sh)
# — separate from the restore-verify ones above so a hand-triggered PITR
# restore can't collide with the weekly automated restore-verify run.
xtrabackup_pitr_restore_path: /var/lib/xtrabackup_pitr_restore
xtrabackup_pitr_restore_port: 5556

# xtrabackup_backup_freshness_hours, xtrabackup_backup_node,
# alert_webhook_format, and alert_webhook_payload_key live in
# group_vars/all/01-vars.yml, not here —
# playbooks/cluster_health.yml can be run standalone (without this role ever
# having run in that process), so anything it needs must be globally defined
# rather than a role default.

# Off-cluster backup replication — opt-in, prompted for interactively by
# install.yml (offsite_backup_host/user/pass/dir); leave offsite_backup_host
# blank at that prompt to disable it entirely. These defaults only matter if
# this role is somehow invoked without that play having set them via
# add_host — same caveat as xtrabackup_effective_backup_node above.
offsite_backup_host: ""
offsite_backup_user: "backupuser"
offsite_backup_dir:  "/var/backups/mysql-ha-cluster"

# Retention on the off-cluster server — deliberately longer than
# xtrabackup_retention_full above: this is the disaster-recovery copy meant
# to survive losing all 3 db nodes' local/replicated storage, not the
# fast-access one, so it's worth keeping a deeper history there.
xtrabackup_offsite_retention_full: 12
