---
# =============================================================================
# xtrabackup — full/diff backups, integrity check, and restore verification.
#
# Every DB node holds an identical copy of the data (Galera synchronous
# replication), so there's no "whichever node is currently primary" logic
# here. Backups just run on one node — xtrabackup_backup_node
# (group_vars/all/01-vars.yml) when it's reachable, otherwise
# playbooks/determine_backup_node.yml (imported by install.yml before this
# role runs) fails over to another db_nodes member and sets
# xtrabackup_active_backup_node accordingly. The `| default(...)` fallback
# below only matters if this role is somehow invoked without that play
# having run first.
# =============================================================================

- name: Resolve the effective backup node for this run
  ansible.builtin.set_fact:
    xtrabackup_effective_backup_node: "{{ xtrabackup_active_backup_node | default(xtrabackup_backup_node, true) }}"

- name: Report that this node is not the active backup node
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: not the active xtrabackup backup node
      ({{ xtrabackup_effective_backup_node }}) — skipping backup setup on this node.
  when: inventory_hostname != xtrabackup_effective_backup_node

# ---------------------------------------------------------------------------
# Cross-node backup replication setup — runs on every db node, not just the
# active one, because xtrabackup_active_backup_node can fail over to any of
# them (playbooks/determine_backup_node.yml). Each node needs to be able to
# push to the other two, so this is a full trust mesh rather than a one-way
# relationship pointed at whichever node happens to be active today.
# ---------------------------------------------------------------------------
- name: Ensure rsync is installed (backup replication to the other db nodes)
  ansible.builtin.apt:
    name: rsync
    state: present

- name: Ensure /root/.ssh exists
  ansible.builtin.file:
    path: /root/.ssh
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Generate a root SSH keypair for backup replication, if one doesn't exist
  ansible.builtin.command: ssh-keygen -t ed25519 -N "" -f /root/.ssh/id_ed25519
  args:
    creates: /root/.ssh/id_ed25519

- name: Read this node's public key
  ansible.builtin.slurp:
    src: /root/.ssh/id_ed25519.pub
  register: xtrabackup_root_pubkey_raw

- name: Record this node's public key as a fact (the other db nodes pick this up below)
  ansible.builtin.set_fact:
    xtrabackup_root_pubkey: "{{ xtrabackup_root_pubkey_raw.content | b64decode | trim }}"

- name: Trust the other db nodes' SSH host keys (so rsync over ssh never prompts)
  ansible.builtin.known_hosts:
    name: "{{ hostvars[item].ansible_host | default(item) }}"
    key: "{{ lookup('pipe', 'ssh-keyscan -t ed25519 ' ~ (hostvars[item].ansible_host | default(item))) }}"
    path: /root/.ssh/known_hosts
  loop: "{{ groups['db_nodes'] | difference([inventory_hostname]) }}"
  loop_control:
    label: "{{ item }}"

- name: Authorize every other db node's root key on this node
  ansible.posix.authorized_key:
    user: root
    key: "{{ hostvars[item].xtrabackup_root_pubkey }}"
    state: present
  loop: "{{ groups['db_nodes'] | difference([inventory_hostname]) }}"
  loop_control:
    label: "{{ item }}"

- name: Create the backup repo, log, and scripts directories on every db node
  # xtrabackup_repo_path must exist everywhere, not just on the active node —
  # it's the rsync destination the active node replicates into on the other
  # two, and it needs to be there in advance of the first backup run.
  # xtrabackup_scripts_dir is also needed everywhere so pitr_restore.sh
  # (below) can be deployed to any db node — thanks to replication, any of
  # them may have a local backup copy to restore from, not just the active
  # backup node.
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - "{{ xtrabackup_repo_path }}"
    - "{{ xtrabackup_log_path }}"
    - "{{ xtrabackup_scripts_dir }}"

- name: Deploy the PITR restore script to every db node
  # Not gated to the active backup node — see the directory task above.
  ansible.builtin.template:
    src: pitr_restore.sh.j2
    dest: "{{ xtrabackup_scripts_dir }}/pitr_restore.sh"
    owner: root
    group: root
    mode: "0700"

- name: Backup setup (active backup node only)
  when: inventory_hostname == xtrabackup_effective_backup_node
  block:
    - name: Install Percona XtraBackup (idempotent — mysql_galera already installs it for SST)
      ansible.builtin.apt:
        name: percona-xtrabackup-80
        state: present

    - name: Create the restore-verify scratch directory (only needed on the active node)
      ansible.builtin.file:
        path: "{{ xtrabackup_restore_verify_path }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Off-cluster backup replication setup (opt-in — blank offsite_backup_host disables it)
      # Bootstraps trust to an external server outside the cluster, so a
      # backup copy survives losing all 3 db nodes' storage (the cross-node
      # rsync mesh above only protects against losing one node). The
      # supplied password is used exactly once, here, to install this node's
      # existing root SSH key (generated above for the cross-node mesh) on
      # the remote account — the actual cron-driven transfer in backup.sh
      # authenticates with that key alone (BatchMode=yes), so the password
      # itself never ends up stored in a script, cron job, or log.
      when: offsite_backup_host | length > 0
      block:
        - name: Ensure sshpass is installed (one-time password auth to install the offsite SSH key)
          ansible.builtin.apt:
            name: sshpass
            state: present

        - name: Trust the off-cluster backup server's SSH host key
          ansible.builtin.known_hosts:
            name: "{{ offsite_backup_host }}"
            key: "{{ lookup('pipe', 'ssh-keyscan -t ed25519 ' ~ offsite_backup_host) }}"
            path: /root/.ssh/known_hosts

        - name: Install this node's SSH public key on the off-cluster backup server
          ansible.builtin.command:
            cmd: >-
              sshpass -p {{ offsite_backup_pass | quote }}
              ssh-copy-id -o StrictHostKeyChecking=accept-new
              -i /root/.ssh/id_ed25519.pub
              {{ offsite_backup_user }}@{{ offsite_backup_host }}
          register: offsite_key_install
          changed_when: "'Number of key(s) added' in offsite_key_install.stdout"
          no_log: true

        - name: Create the destination directory on the off-cluster backup server
          ansible.builtin.command:
            cmd: >-
              ssh -o BatchMode=yes {{ offsite_backup_user }}@{{ offsite_backup_host }}
              mkdir -p {{ offsite_backup_dir }}
          changed_when: false

    - name: Deploy alert + backup/check/restore-verify scripts
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "{{ xtrabackup_scripts_dir }}/{{ item }}"
        owner: root
        group: root
        mode: "0700"
      loop:
        - alert.sh
        - backup.sh
        - check.sh
        - restore_verify.sh

    - name: Deploy backup/check/restore-verify cron jobs
      ansible.builtin.cron:
        name: "{{ item.name }}"
        user: root
        minute: "{{ item.schedule.minute | default('*') }}"
        hour: "{{ item.schedule.hour | default('*') }}"
        weekday: "{{ item.schedule.weekday | default('*') }}"
        job: "{{ xtrabackup_scripts_dir }}/{{ item.script }} >> {{ xtrabackup_log_path }}/{{ item.name | replace(' ', '_') }}.log 2>&1"
      loop:
        - name: xtrabackup full backup
          script: backup.sh full
          schedule: "{{ xtrabackup_full_backup_cron }}"
        - name: xtrabackup diff backup
          script: backup.sh diff
          schedule: "{{ xtrabackup_diff_backup_cron }}"
        - name: xtrabackup check
          script: check.sh
          schedule: "{{ xtrabackup_check_cron }}"
        - name: xtrabackup restore verify
          script: restore_verify.sh
          schedule: "{{ xtrabackup_restore_verify_cron }}"
      loop_control:
        label: "{{ item.name }}"

    # xtrabackup_full_backup_cron only fires weekly (default: Sunday 01:00), so
    # a freshly-installed node would otherwise sit with an empty backup repo
    # until the following Sunday — and every diff/check cron in between fails
    # with "no prior full backup" / "no backups found" until then. Seed one now.
    - name: Check for an existing full backup
      ansible.builtin.find:
        paths: "{{ xtrabackup_repo_path }}"
        patterns: "full-*"
        file_type: directory
      register: xtrabackup_existing_full_backups

    - name: Run initial full backup (fresh install — nothing for cron to diff/check against yet)
      ansible.builtin.command: "{{ xtrabackup_scripts_dir }}/backup.sh full"
      async: 3600
      poll: 15
      when: xtrabackup_existing_full_backups.matched == 0
      changed_when: true
