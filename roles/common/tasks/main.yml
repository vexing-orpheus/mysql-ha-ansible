---
# =============================================================================
# common — OS prep shared by every node: packages, NTP, hosts file, kernel
# tuning, THP, firewall, PGDG repo. x86_64 only.
# =============================================================================

- name: Fail fast on non-x86_64 hosts
  ansible.builtin.assert:
    that: ansible_architecture == "x86_64"
    fail_msg: >-
      This playbook targets x86_64 only. {{ inventory_hostname }} reports
      architecture '{{ ansible_architecture }}'.

- name: Determine detected vCPU count
  ansible.builtin.set_fact:
    detected_vcpus: "{{ ansible_processor_vcpus | default(ansible_processor_count) }}"

- name: Fail fast on insufficient CPU
  ansible.builtin.assert:
    that: detected_vcpus | int >= min_cpu_vcpus
    fail_msg: >-
      {{ inventory_hostname }} has {{ detected_vcpus }} vCPU(s); minimum is
      {{ min_cpu_vcpus }}.

- name: Fail fast on insufficient RAM
  ansible.builtin.assert:
    that: ansible_memtotal_mb | int >= min_ram_mb
    fail_msg: >-
      {{ inventory_hostname }} has {{ ansible_memtotal_mb }}MB RAM; minimum
      is {{ min_ram_mb }}MB (~8GB).

- name: Find the OS root filesystem's mount facts
  ansible.builtin.set_fact:
    root_mount: "{{ ansible_mounts | selectattr('mount', 'equalto', '/') | first }}"

- name: Fail fast on undersized OS volume
  ansible.builtin.assert:
    that: root_mount.size_total | int >= (min_os_disk_gb * 1024 * 1024 * 1024)
    fail_msg: >-
      {{ inventory_hostname }} root filesystem is
      {{ (root_mount.size_total | int / (1024 * 1024 * 1024)) | round(1) }}GB;
      minimum OS volume size is {{ min_os_disk_gb }}GB.

- name: Warn if a DB node is below the recommended CPU/RAM sizing
  ansible.builtin.debug:
    msg: >-
      RECOMMENDATION: {{ inventory_hostname }} is a DB node with
      {{ detected_vcpus }} vCPU / {{ ansible_memtotal_mb }}MB RAM detected.
      DB nodes are recommended to have at least {{ db_recommended_cpu_vcpus }}
      vCPU / {{ db_recommended_ram_mb }}MB RAM.
  when: >-
    inventory_hostname in groups['db_nodes'] and
    (detected_vcpus | int < db_recommended_cpu_vcpus or
     ansible_memtotal_mb | int < db_recommended_ram_mb)

- name: Enforce a dedicated data volume on DB nodes
  when: inventory_hostname in groups['db_nodes']
  block:
    - name: Start from the OS root volume as the fallback data-directory mount
      ansible.builtin.set_fact:
        pg_data_mount: "{{ root_mount }}"

    - name: Find the most specific mount point backing the PostgreSQL data directory
      ansible.builtin.set_fact:
        pg_data_mount: "{{ item }}"
      loop: "{{ ansible_mounts }}"
      loop_control:
        label: "{{ item.mount }}"
      when: >-
        (item.mount == pg_data_dir or
         pg_data_dir.startswith(item.mount.rstrip('/') + '/')) and
        item.mount | length > pg_data_mount.mount | length

    - name: Assert the data directory is on a separate volume from the OS
      ansible.builtin.assert:
        that: pg_data_mount.device != root_mount.device
        fail_msg: >-
          {{ inventory_hostname }}: no dedicated data volume detected for
          {{ pg_data_dir }} — it resolves to the same device
          ({{ pg_data_mount.device }}) as the OS root volume ({{ root_mount.mount }}).
          DB nodes require {{ pg_data_dir }} (or a parent directory, e.g.
          /var/lib/postgresql) mounted on its own volume, separate from
          the 50GB OS volume.

- name: Update apt cache and upgrade packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: safe
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Configure chrony
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart chrony

- name: Ensure chrony is enabled and running
  ansible.builtin.systemd:
    name: chrony
    enabled: true
    state: started

- name: Populate /etc/hosts with cluster node entries
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "## {mark} PG-HA-CLUSTER"
    block: |
      {% for host in groups['db_nodes'] %}
      {{ hostvars[host].ansible_host }}    {{ host }}
      {% endfor %}
      {% for host in groups['proxy_nodes'] %}
      {{ hostvars[host].ansible_host }} {{ host }}
      {% endfor %}
      {{ cluster_vip }}    pg-cluster-vip

- name: Write sysctl tuning for PostgreSQL HA
  ansible.builtin.template:
    src: 90-pg-ha-cluster.conf.j2
    dest: /etc/sysctl.d/90-pg-ha-cluster.conf
    owner: root
    group: root
    mode: "0644"
  notify: apply sysctl

- name: Write ulimits for postgres/root
  ansible.builtin.template:
    src: 90-pg-ha-cluster.limits.conf.j2
    dest: /etc/security/limits.d/90-pg-ha-cluster.conf
    owner: root
    group: root
    mode: "0644"

- name: Install THP-disable systemd unit
  ansible.builtin.template:
    src: disable-thp.service.j2
    dest: /etc/systemd/system/disable-thp.service
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd and enable thp service

- name: Install CPU performance-governor systemd unit
  ansible.builtin.template:
    src: cpu-performance-governor.service.j2
    dest: /etc/systemd/system/cpu-performance-governor.service
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd and enable cpu governor service

- name: Add PGDG apt repository (key + repo in one deb822 source)
  ansible.builtin.deb822_repository:
    name: pgdg
    types: deb
    uris: https://apt.postgresql.org/pub/repos/apt
    suites: "{{ ansible_distribution_release }}-pgdg"
    components: main
    architectures: amd64
    signed_by: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    state: present
  register: pgdg_repo_added

- name: Refresh apt cache after adding PGDG repo
  ansible.builtin.apt:
    update_cache: true
  when: pgdg_repo_added.changed

- name: Reset UFW to known defaults
  community.general.ufw:
    state: reset
  changed_when: false

- name: UFW default policy — deny incoming
  community.general.ufw:
    direction: incoming
    policy: deny

- name: UFW default policy — allow outgoing
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: UFW allow OpenSSH
  community.general.ufw:
    rule: allow
    name: OpenSSH

- name: UFW — DB node rules (Postgres, Patroni REST, etcd)
  when: inventory_hostname in groups['db_nodes']
  block:
    - name: Allow Postgres from every DB and proxy node
      community.general.ufw:
        rule: allow
        proto: tcp
        from_ip: "{{ hostvars[item].ansible_host }}"
        to_port: "{{ pg_port | string }}"
      loop: "{{ groups['db_nodes'] + groups['proxy_nodes'] }}"

    - name: Allow Patroni REST API from proxy nodes
      community.general.ufw:
        rule: allow
        proto: tcp
        from_ip: "{{ hostvars[item].ansible_host }}"
        to_port: "{{ patroni_api_port | string }}"
      loop: "{{ groups['proxy_nodes'] }}"

    - name: Allow etcd client/peer traffic between DB nodes
      community.general.ufw:
        rule: allow
        proto: tcp
        from_ip: "{{ hostvars[item].ansible_host }}"
        to_port: "{{ port | string }}"
      loop: "{{ groups['db_nodes'] }}"
      loop_control:
        loop_var: item
      vars:
        port: "{{ etcd_client_port }}"

    - name: Allow etcd peer traffic between DB nodes
      community.general.ufw:
        rule: allow
        proto: tcp
        from_ip: "{{ hostvars[item].ansible_host }}"
        to_port: "{{ etcd_peer_port | string }}"
      loop: "{{ groups['db_nodes'] }}"

- name: UFW — proxy node rules (PgBouncer, HAProxy, VRRP)
  when: inventory_hostname in groups['proxy_nodes']
  block:
    - name: Allow PgBouncer from app network
      community.general.ufw:
        rule: allow
        proto: tcp
        from_ip: "{{ app_network }}"
        to_port: "{{ pgbouncer_port | string }}"

    - name: Allow HAProxy write/read from app network
      community.general.ufw:
        rule: allow
        proto: tcp
        from_ip: "{{ app_network }}"
        to_port: "{{ item | string }}"
      loop:
        - "{{ haproxy_write_port }}"
        - "{{ haproxy_read_port }}"

    - name: Allow HAProxy stats from ops network
      community.general.ufw:
        rule: allow
        proto: tcp
        from_ip: "{{ ops_network }}"
        to_port: "{{ haproxy_stats_port | string }}"

    - name: Allow VRRP between proxy peers
      community.general.ufw:
        rule: allow
        from_ip: "{{ hostvars[item].ansible_host }}"
      loop: "{{ groups['proxy_nodes'] }}"
      when: item != inventory_hostname

- name: Enable UFW
  community.general.ufw:
    state: enabled
