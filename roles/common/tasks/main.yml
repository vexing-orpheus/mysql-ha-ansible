---
# =============================================================================
# common — OS prep shared by every node: packages, NTP, hosts file, kernel
# tuning, THP, firewall, Percona repo. x86_64 only.
# =============================================================================

- name: Enter maintenance mode (silences service-down alerts for the rest of this playbook run)
  # Marker lives on tmpfs (/run) so it self-clears on reboot rather than
  # sticking forever if a run gets interrupted before reaching the "Exit
  # maintenance mode" play at the end of playbooks/cluster_health.yml. See
  # roles/common/templates/service-down-alert.sh.j2 for how this is checked.
  ansible.builtin.file:
    path: "{{ mysql_ha_silence_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Touch the maintenance marker
  ansible.builtin.file:
    path: "{{ mysql_ha_silence_dir }}/maintenance"
    state: touch
    owner: root
    group: root
    mode: "0600"
  changed_when: false

- name: Fail fast on non-x86_64 hosts
  ansible.builtin.assert:
    that: ansible_architecture == "x86_64"
    fail_msg: >-
      This playbook targets x86_64 only. {{ inventory_hostname }} reports
      architecture '{{ ansible_architecture }}'.

- name: Determine detected vCPU count
  ansible.builtin.set_fact:
    detected_vcpus: "{{ ansible_processor_vcpus | default(ansible_processor_count) }}"

- name: Fail fast on insufficient CPU
  ansible.builtin.assert:
    that: detected_vcpus | int >= min_cpu_vcpus
    fail_msg: >-
      {{ inventory_hostname }} has {{ detected_vcpus }} vCPU(s); minimum is
      {{ min_cpu_vcpus }}.

- name: Fail fast on insufficient RAM
  ansible.builtin.assert:
    that: ansible_memtotal_mb | int >= min_ram_mb
    fail_msg: >-
      {{ inventory_hostname }} has {{ ansible_memtotal_mb }}MB RAM; minimum
      is {{ min_ram_mb }}MB (~8GB).

- name: Find the OS root filesystem's mount facts
  ansible.builtin.set_fact:
    root_mount: "{{ ansible_mounts | selectattr('mount', 'equalto', '/') | first }}"

- name: Fail fast on undersized OS volume
  ansible.builtin.assert:
    that: root_mount.size_total | int >= (min_os_disk_gb * 1024 * 1024 * 1024)
    fail_msg: >-
      {{ inventory_hostname }} root filesystem is
      {{ (root_mount.size_total | int / (1024 * 1024 * 1024)) | round(1) }}GB;
      minimum OS volume size is {{ min_os_disk_gb }}GB.

- name: Warn if a DB node is below the recommended CPU/RAM sizing
  ansible.builtin.debug:
    msg: >-
      RECOMMENDATION: {{ inventory_hostname }} is a DB node with
      {{ detected_vcpus }} vCPU / {{ ansible_memtotal_mb }}MB RAM detected.
      DB nodes are recommended to have at least {{ db_recommended_cpu_vcpus }}
      vCPU / {{ db_recommended_ram_mb }}MB RAM.
  when: >-
    inventory_hostname in groups['db_nodes'] and
    (detected_vcpus | int < db_recommended_cpu_vcpus or
     ansible_memtotal_mb | int < db_recommended_ram_mb)

- name: Check for a dedicated data volume on DB nodes (recommended, not required)
  when: inventory_hostname in groups['db_nodes']
  block:
    - name: Start from the OS root volume as the fallback data-directory mount
      ansible.builtin.set_fact:
        mysql_data_mount: "{{ root_mount }}"

    - name: Find the most specific mount point backing the MySQL data directory
      ansible.builtin.set_fact:
        mysql_data_mount: "{{ item }}"
      loop: "{{ ansible_mounts }}"
      loop_control:
        label: "{{ item.mount }}"
      when: >-
        (item.mount == mysql_data_dir or
         mysql_data_dir.startswith(item.mount.rstrip('/') + '/')) and
        item.mount | length > mysql_data_mount.mount | length

    - name: Warn if the data directory shares a device with the OS volume
      ansible.builtin.debug:
        msg: >-
          RECOMMENDATION: {{ inventory_hostname }}: no dedicated data volume
          detected for {{ mysql_data_dir }} — it resolves to the same device
          ({{ mysql_data_mount.device }}) as the OS root volume ({{ root_mount.mount }}).
          For production use, mount {{ mysql_data_dir }} (or a parent directory,
          e.g. /var/lib/mysql) on its own volume, separate from the OS disk,
          so backups/binlog growth can't fill the root filesystem.
      when: mysql_data_mount.device == root_mount.device

- name: Configure chrony
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: "0644"

- name: Ensure chrony is enabled and running with our config
  # Unconditional restart rather than notify/state:started — a host's
  # chronyd may already be running (e.g. Ubuntu's default NTS bootstrap
  # servers at first boot) from before Ansible ever wrote this file, in
  # which case a plain "started" is a no-op and a file-diff-triggered
  # handler never fires on a later idempotent run where the file already
  # matches. Restarting every run guarantees chronyd is actually using our
  # config before the sync-wait task below relies on it.
  ansible.builtin.systemd:
    name: chrony
    enabled: true
    state: restarted

- name: Wait for chrony to synchronize the system clock
  # Starting chrony doesn't wait for it to actually correct the clock — on a
  # freshly booted/cloned VM with a skewed hardware clock, apt's signed repo
  # metadata (both the base Ubuntu repos below and the Percona repo further
  # down) can fail with "Release file ... is not valid yet" if we touch it
  # before the clock is fixed. This must run before any apt cache update.
  ansible.builtin.command: chronyc waitsync 30 1 0 2
  changed_when: false

- name: Update apt cache and upgrade packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: safe
    cache_valid_time: 3600
    lock_timeout: 120

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Populate /etc/hosts with cluster node entries
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "## {mark} MYSQL-HA-CLUSTER"
    block: |
      {% for host in groups['db_nodes'] %}
      {{ hostvars[host].ansible_host }}    {{ host }}
      {% endfor %}
      {% for host in groups['proxy_nodes'] %}
      {{ hostvars[host].ansible_host }} {{ host }}
      {% endfor %}
      {{ cluster_vip }}    mysql-cluster-vip

- name: Create the shared scripts directory
  ansible.builtin.file:
    path: "{{ mysql_ha_scripts_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Deploy the shared alert script
  ansible.builtin.template:
    src: alert.sh.j2
    dest: "{{ mysql_ha_scripts_dir }}/alert.sh"
    owner: root
    group: root
    mode: "0700"

- name: Deploy the service-down alert script
  # Called via ExecStopPost= drop-ins added by mysql_galera (mysql.service,
  # xinetd.service) and haproxy_keepalived (haproxy.service,
  # keepalived.service) — see those roles and
  # roles/common/templates/service-down-alert.sh.j2 for the maintenance-mode
  # suppression logic.
  ansible.builtin.template:
    src: service-down-alert.sh.j2
    dest: "{{ mysql_ha_scripts_dir }}/service-down-alert.sh"
    owner: root
    group: root
    mode: "0700"

- name: Write sysctl tuning for MySQL HA
  ansible.builtin.template:
    src: 90-mysql-ha-cluster.conf.j2
    dest: /etc/sysctl.d/90-mysql-ha-cluster.conf
    owner: root
    group: root
    mode: "0644"
  notify: apply sysctl

- name: Write ulimits for mysql/root
  ansible.builtin.template:
    src: 90-mysql-ha-cluster.limits.conf.j2
    dest: /etc/security/limits.d/90-mysql-ha-cluster.conf
    owner: root
    group: root
    mode: "0644"

- name: Install THP-disable systemd unit
  ansible.builtin.template:
    src: disable-thp.service.j2
    dest: /etc/systemd/system/disable-thp.service
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd and enable thp service

- name: Install CPU performance-governor systemd unit
  ansible.builtin.template:
    src: cpu-performance-governor.service.j2
    dest: /etc/systemd/system/cpu-performance-governor.service
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd and enable cpu governor service

- name: Check whether percona-release is already installed
  ansible.builtin.command: dpkg-query -W -f='${Status}' percona-release
  register: percona_release_check
  changed_when: false
  failed_when: false

- name: Download percona-release repository package
  ansible.builtin.get_url:
    url: "https://repo.percona.com/apt/percona-release_latest.{{ ansible_distribution_release }}_all.deb"
    dest: /tmp/percona-release_latest.deb
    mode: "0644"
  when: "'install ok installed' not in percona_release_check.stdout"

- name: Install percona-release repository package
  ansible.builtin.apt:
    deb: /tmp/percona-release_latest.deb
    state: present
  when: "'install ok installed' not in percona_release_check.stdout"
  register: percona_release_installed

- name: Create a temp dir for the lsb_release shim
  ansible.builtin.tempfile:
    state: directory
    prefix: percona-release-shim.
  register: percona_shim_dir

- name: Write an lsb_release shim reporting a Percona-supported codename
  ansible.builtin.copy:
    dest: "{{ percona_shim_dir.path }}/lsb_release"
    mode: "0755"
    content: |
      #!/bin/sh
      if [ "$1" = "-sc" ]; then
        echo "{{ percona_release_os_codename_fallback }}"
      else
        exec /usr/bin/lsb_release "$@"
      fi

- name: Enable the Percona XtraDB Cluster product repo
  # percona-release derives the apt codename solely from `lsb_release -sc`
  # and decides OS support by probing repo.percona.com/<repo>/apt/dists/
  # <codename>/. Percona has not published that directory for this fleet's
  # OS codename at all, so the real codename always fails here; we always
  # pin lsb_release's answer to a codename Percona does publish instead of
  # probing first. See percona_release_os_codename_fallback in group_vars
  # for how/when to move off this.
  ansible.builtin.command: percona-release setup -y {{ percona_product_series }}
  environment:
    PATH: "{{ percona_shim_dir.path }}:{{ ansible_env.PATH }}"
  register: percona_repo_setup
  changed_when: "'exiting' not in percona_repo_setup.stdout"

- name: Enable the Percona Tools repository (for XtraBackup/qpress)
  # percona-xtrabackup-80 is not part of the pxc-80 repo `setup` enables
  # above — it lives in the separate "tools" component, which needs its own
  # explicit enable.
  ansible.builtin.command: percona-release enable tools release
  environment:
    PATH: "{{ percona_shim_dir.path }}:{{ ansible_env.PATH }}"
  register: percona_tools_repo_setup
  changed_when: "'exiting' not in percona_tools_repo_setup.stdout"

- name: Remove the lsb_release shim
  ansible.builtin.file:
    path: "{{ percona_shim_dir.path }}"
    state: absent

- name: Refresh apt cache after enabling the Percona repo
  ansible.builtin.apt:
    update_cache: true
  when: >-
    percona_release_installed.changed or percona_repo_setup.changed or
    percona_tools_repo_setup.changed

- name: Reset UFW to known defaults
  community.general.ufw:
    state: reset
  changed_when: false

- name: UFW default policy — deny incoming
  community.general.ufw:
    direction: incoming
    policy: deny

- name: UFW default policy — allow outgoing
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: UFW allow OpenSSH
  community.general.ufw:
    rule: allow
    name: OpenSSH

- name: UFW — DB node rules (MySQL, Galera replication/IST/SST)
  when: inventory_hostname in groups['db_nodes']
  block:
    - name: Allow MySQL from every DB and proxy node
      community.general.ufw:
        rule: allow
        proto: tcp
        from_ip: "{{ hostvars[item].ansible_host }}"
        to_port: "{{ mysql_port | string }}"
      loop: "{{ groups['db_nodes'] + groups['proxy_nodes'] }}"

    - name: Allow Galera replication traffic (gcomm, tcp+udp) between DB nodes
      community.general.ufw:
        rule: allow
        proto: "{{ item.1 }}"
        from_ip: "{{ hostvars[item.0].ansible_host }}"
        to_port: "{{ galera_replication_port | string }}"
      loop: "{{ groups['db_nodes'] | product(['tcp', 'udp']) | list }}"
      loop_control:
        label: "{{ item.0 }}/{{ item.1 }}"

    - name: Allow Galera IST traffic between DB nodes
      community.general.ufw:
        rule: allow
        proto: tcp
        from_ip: "{{ hostvars[item].ansible_host }}"
        to_port: "{{ galera_ist_port | string }}"
      loop: "{{ groups['db_nodes'] }}"

    - name: Allow Galera SST traffic between DB nodes
      community.general.ufw:
        rule: allow
        proto: tcp
        from_ip: "{{ hostvars[item].ansible_host }}"
        to_port: "{{ galera_sst_port | string }}"
      loop: "{{ groups['db_nodes'] }}"

    - name: Allow the clustercheck health endpoint from proxy nodes
      community.general.ufw:
        rule: allow
        proto: tcp
        from_ip: "{{ hostvars[item].ansible_host }}"
        to_port: "{{ clustercheck_port | string }}"
      loop: "{{ groups['proxy_nodes'] }}"

- name: UFW — proxy node rules (HAProxy, VRRP)
  when: inventory_hostname in groups['proxy_nodes']
  block:
    - name: Allow HAProxy write/read from app network
      community.general.ufw:
        rule: allow
        proto: tcp
        from_ip: "{{ app_network }}"
        to_port: "{{ item | string }}"
      loop:
        - "{{ haproxy_write_port }}"
        - "{{ haproxy_read_port }}"

    - name: Allow HAProxy stats from ops network
      community.general.ufw:
        rule: allow
        proto: tcp
        from_ip: "{{ ops_network }}"
        to_port: "{{ haproxy_stats_port | string }}"

    - name: Allow VRRP between proxy peers
      community.general.ufw:
        rule: allow
        from_ip: "{{ hostvars[item].ansible_host }}"
      loop: "{{ groups['proxy_nodes'] }}"
      when: item != inventory_hostname

- name: Enable UFW
  community.general.ufw:
    state: enabled
