---
- name: apply sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: reload systemd and enable thp service
  ansible.builtin.systemd:
    name: disable-thp
    daemon_reload: true
    enabled: true
    state: started

- name: reload systemd and enable cpu governor service
  ansible.builtin.systemd:
    name: cpu-performance-governor
    daemon_reload: true
    enabled: true
    state: started

- name: reload systemd for alert-on-failure unit
  ansible.builtin.systemd:
    daemon_reload: true
