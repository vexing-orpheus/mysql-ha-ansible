---
# =============================================================================
# pgbackrest — WAL archiving + backup/restore-verification for the current
# Patroni primary on this node, with a local-disk repo (see README).
# =============================================================================

- name: Install pgbackrest
  ansible.builtin.apt:
    name: pgbackrest
    state: present

- name: Create pgbackrest directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"
  loop:
    - "{{ pgbackrest_repo_path }}"
    - "{{ pgbackrest_log_path }}"
    - "{{ pgbackrest_restore_verify_path }}"

- name: Create pgbackrest scripts directory
  ansible.builtin.file:
    path: "{{ pgbackrest_scripts_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"

- name: Write pgbackrest.conf
  ansible.builtin.template:
    src: pgbackrest.conf.j2
    dest: /etc/pgbackrest.conf
    owner: postgres
    group: postgres
    mode: "0640"

- name: Deploy alert + backup/check/restore-verify scripts
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ pgbackrest_scripts_dir }}/{{ item }}"
    owner: postgres
    group: postgres
    mode: "0700"
  loop:
    - alert.sh
    - backup.sh
    - check.sh
    - restore_verify.sh

- name: Query this node's current Patroni role
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ patroni_api_port }}/patroni"
    return_content: true
    status_code: 200
  register: pgbackrest_patroni_status
  failed_when: false

- name: Create the pgbackrest stanza (idempotent)
  ansible.builtin.command: >
    pgbackrest --stanza={{ patroni_scope }}
    {{ '' if (pgbackrest_patroni_status.json.role | default('')) in ['master', 'primary'] else '--no-online' }}
    stanza-create
  changed_when: false

- name: Deploy backup/check/restore-verify cron jobs
  ansible.builtin.cron:
    name: "{{ item.name }}"
    user: postgres
    minute: "{{ item.schedule.minute | default('*') }}"
    hour: "{{ item.schedule.hour | default('*') }}"
    weekday: "{{ item.schedule.weekday | default('*') }}"
    job: "{{ pgbackrest_scripts_dir }}/{{ item.script }} >> {{ pgbackrest_log_path }}/{{ item.name | replace(' ', '_') }}.log 2>&1"
  loop:
    - name: pgbackrest full backup
      script: backup.sh full
      schedule: "{{ pgbackrest_full_backup_cron }}"
    - name: pgbackrest diff backup
      script: backup.sh diff
      schedule: "{{ pgbackrest_diff_backup_cron }}"
    - name: pgbackrest check
      script: check.sh
      schedule: "{{ pgbackrest_check_cron }}"
    - name: pgbackrest restore verify
      script: restore_verify.sh
      schedule: "{{ pgbackrest_restore_verify_cron }}"
  loop_control:
    label: "{{ item.name }}"
