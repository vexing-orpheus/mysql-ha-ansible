---
# =============================================================================
# install.yml — builds the whole MySQL HA cluster from scratch, run from a
# separate Ansible control VM.
#
#   ansible-playbook install.yml
#
# No flags needed and nothing is stored on disk: every credential (SSH login,
# MySQL root/SST/health/app accounts, HAProxy stats, keepalived VRRP, the
# alert webhook) is prompted for interactively by the first play below and
# applied to every host for the rest of the run.
#
# Order matters:
#   0. Collect connection credentials — prompts once, applies to every host
#   1. common       — OS prep on every node (parallel)
#   2. mysql_galera — Percona XtraDB Cluster (Galera) on db_nodes, one at a
#                     time (serial: 1) so db-node-1 deterministically
#                     bootstraps a brand-new cluster before the others start
#                     and join via IST/SST. Galera has its own built-in
#                     quorum/group communication, so no separate DCS play is
#                     needed.
#   3. xtrabackup   — full/diff backups, integrity check, restore-verify cron
#                     on one DB node (db_nodes) — xtrabackup_backup_node if
#                     reachable, otherwise automatic failover to another
#                     db_nodes member (see playbooks/determine_backup_node.yml)
#   4. haproxy_keepalived — read/write routing + VIP failover (proxy_nodes)
#   5. cluster_health — read-only post-build gate; fails the run if wsrep
#                     state is wrong or a service is down
# =============================================================================

- name: Collect connection credentials and cluster secrets
  hosts: localhost
  connection: local
  gather_facts: false
  vars_prompt:
    - name: ssh_user
      prompt: "SSH username"
      private: false
    - name: ssh_pass
      prompt: "SSH / sudo password (blank to use SSH keys + passwordless sudo)"
      private: true
    - name: cluster_vip
      prompt: "Cluster VIP address (floats between proxy nodes via keepalived)"
      private: false
      default: "10.223.16.79"
    - name: app_network
      prompt: "App network CIDR (allowed to reach HAProxy)"
      private: false
      default: "10.223.16.0/24"
    - name: ops_network
      prompt: "Ops network CIDR (allowed to reach HAProxy stats)"
      private: false
      default: "10.223.16.0/24"
    - name: mysql_root_pass
      prompt: "MySQL root password"
      private: true
    - name: sst_user
      prompt: "Galera SST username (used internally between DB nodes)"
      private: false
      default: "sstuser"
    - name: sst_password
      prompt: "Galera SST password"
      private: true
    - name: health_user
      prompt: "Health-check (clustercheck) DB username"
      private: false
      default: "clustercheck"
    - name: health_pass
      prompt: "Health-check (clustercheck) DB password"
      private: true
    - name: app_db
      prompt: "Application database name"
      private: false
      default: "appdb"
    - name: app_db_user
      prompt: "Application database username"
      private: false
      default: "appuser"
    - name: app_db_pass
      prompt: "Application database password"
      private: true
    - name: haproxy_stats_user
      prompt: "HAProxy stats username"
      private: false
      default: "haproxyadmin"
    - name: haproxy_stats_pass
      prompt: "HAProxy stats password"
      private: true
    - name: vrrp_auth_pass
      prompt: "VRRP (keepalived) authentication password"
      private: true
    - name: alert_webhook_url
      prompt: "Alert webhook URL (blank to disable alerts)"
      private: false
  tasks:
    - name: Apply credentials, secrets, and network settings to every cluster host
      ansible.builtin.add_host:
        name: "{{ item }}"
        ansible_user: "{{ ssh_user }}"
        ansible_password: "{{ ssh_pass if ssh_pass | length > 0 else omit }}"
        ansible_become_password: "{{ ssh_pass if ssh_pass | length > 0 else omit }}"
        cluster_vip: "{{ cluster_vip }}"
        app_network: "{{ app_network }}"
        ops_network: "{{ ops_network }}"
        mysql_root_pass: "{{ mysql_root_pass | default('iforgottoaddapassword', true) }}"
        sst_user: "{{ sst_user }}"
        sst_password: "{{ sst_password | default('iforgottoaddapassword', true) }}"
        health_user: "{{ health_user }}"
        health_pass: "{{ health_pass | default('iforgottoaddapassword', true) }}"
        app_db: "{{ app_db }}"
        app_db_user: "{{ app_db_user }}"
        app_db_pass: "{{ app_db_pass | default('iforgottoaddapassword', true) }}"
        haproxy_stats_user: "{{ haproxy_stats_user }}"
        haproxy_stats_pass: "{{ haproxy_stats_pass | default('iforgottoaddapassword', true) }}"
        vrrp_auth_pass: "{{ vrrp_auth_pass | default('iforgottoaddapassword', true) }}"
        alert_webhook_url: "{{ alert_webhook_url }}"
      loop: "{{ groups['mysql_ha_cluster'] }}"
      loop_control:
        label: "{{ item }}"
      no_log: true

    - name: Apply alert webhook URL to the control node (for cluster_health.yml's own alert task)
      ansible.builtin.add_host:
        name: localhost
        alert_webhook_url: "{{ alert_webhook_url }}"
      no_log: true

- name: OS preparation — every node
  hosts: mysql_ha_cluster
  become: true
  # lock_timeout: on a freshly booted/restored VM, cloud-init's
  # unattended-upgrades can be mid-run and holding /var/lib/dpkg/lock-frontend
  # when our first apt task fires; without this, ansible.builtin.apt fails
  # immediately instead of waiting for it to finish.
  module_defaults:
    ansible.builtin.apt:
      lock_timeout: 300
  roles:
    - common

- name: Percona XtraDB Cluster (Galera) — DB nodes (one at a time, db-node-1 first)
  hosts: db_nodes
  become: true
  serial: 1
  module_defaults:
    ansible.builtin.apt:
      lock_timeout: 300
  roles:
    - mysql_galera

- name: Determine active xtrabackup backup node (failover-aware)
  ansible.builtin.import_playbook: playbooks/determine_backup_node.yml

- name: Backups, integrity check, restore verification — DB nodes
  hosts: db_nodes
  become: true
  module_defaults:
    ansible.builtin.apt:
      lock_timeout: 300
  roles:
    - xtrabackup

- name: Connection routing and load balancing — proxy nodes
  hosts: proxy_nodes
  become: true
  module_defaults:
    ansible.builtin.apt:
      lock_timeout: 300
  roles:
    - haproxy_keepalived

- name: Post-build health check
  ansible.builtin.import_playbook: playbooks/cluster_health.yml
