---
# =============================================================================
# Global cluster variables — x86_64 only. Non-secret settings live here.
# Credentials (MySQL root/SST/app accounts, HAProxy stats, keepalived VRRP,
# the alert webhook) are never committed to disk — they're prompted for
# interactively by install.yml's "Collect connection credentials and cluster
# secrets" play (and by playbooks/cluster_health.yml's own prompt when run
# standalone). See README.md.
# =============================================================================

# ── Network ───────────────────────────────────────────────────────────────
# vip_interface: enp1s0        # optional override — auto-detected from each
                                # proxy node's default route if left unset
vip_prefix:    24
ntp_server:    pool.ntp.org

# cluster_vip / app_network / ops_network are prompted for interactively
# instead of living here (see the header note above about credential prompts).

# VRRP: true = unicast (cloud/VMware safe default), false = multicast
keepalived_unicast: true
vrrp_router_id:     51
# vrrp_auth_pass is prompted for interactively — see the header note above.

# ── Cluster identity ─────────────────────────────────────────────────────
galera_cluster_name: mysql-ha-cluster

# ── MySQL / Percona XtraDB Cluster ───────────────────────────────────────
percona_product_series: pxc80                # Percona repo series — override with -e for a different major version
# percona-release detects the OS purely via `lsb_release -sc` and has no
# override flag; it decides support by probing repo.percona.com for a
# dists/<codename>/ directory. Percona has not published that directory at
# all for this fleet's actual codename, so the common role always shims
# lsb_release to report this codename instead when running
# `percona-release setup`/`enable`, rather than probing the real one first.
# Once Percona ships repos for the fleet's actual codename, drop the shim
# tasks in common/tasks/main.yml (or point this at the real codename) —
# override with -e in the meantime for a different fallback.
percona_release_os_codename_fallback: noble
mysql_port:        3306
mysql_data_dir:    /var/lib/mysql
mysql_log_dir:     /var/log/mysql
mysql_socket:      /var/run/mysqld/mysqld.sock

# Auto-sized at role runtime from ansible_memtotal_mb; override to pin.
# innodb_buffer_pool_size_override: 8G
# 55%, not the more common 70-80%, because this fleet runs under strict
# memory overcommit (vm.overcommit_memory=2): the buffer pool + gcache are
# reserved virtual memory that counts fully against CommitLimit, and at 70%
# a 15-16GB node left well under 200MB of commit headroom — enough for
# mysqld itself, but not for SSH/Ansible's own subprocess forks to manage
# the box afterward. 55% leaves several GB of headroom instead.
innodb_buffer_pool_pct: 55                   # % of RAM given to InnoDB's buffer pool
galera_gcache_size_mb:  1024                 # Galera write-set cache (gcache.size)

# Ceiling for well-provisioned nodes — roles/mysql_galera scales this down on
# smaller ones using whatever RAM is left over after the buffer pool and
# gcache (see mysql_conn_* in roles/mysql_galera/defaults/main.yml), so a
# minimum-spec node never advertises more connections than it can back.
# mysql_max_connections_override: 300        # pin a fixed value, bypassing the RAM-based calc
mysql_max_connections:  500

# ── Ports ─────────────────────────────────────────────────────────────────
galera_replication_port: 4567                # wsrep group communication (tcp+udp)
galera_ist_port:         4568                # incremental state transfer
galera_sst_port:         4444                # state snapshot transfer (xtrabackup-v2)
clustercheck_port:       9200                # local health endpoint HAProxy polls (one per DB node)
haproxy_write_port:      5000
haproxy_read_port:       5001
haproxy_stats_port:      7000

# ── Backups / alerts ──────────────────────────────────────────────────────
# Global (not role defaults) because playbooks/cluster_health.yml can run
# standalone, without the xtrabackup role ever having run in that process.
# alert_webhook_url is prompted for interactively — see the header note above.
# alert_webhook_format: "simple" posts a flat {key: message} object (what
# Slack/Discord incoming webhooks expect); "teams" posts a MessageCard object
# instead, the shape Microsoft Teams / a Power Automate "When an HTTP request
# is received" trigger built around a Teams post normally expects.
alert_webhook_format: teams
alert_webhook_payload_key: text   # only used when alert_webhook_format is "simple": "text" for Slack, "content" for Discord

# Where the shared alert.sh / service-down-alert.sh (roles/common) live on
# every cluster node, and the /run (tmpfs — self-clears on reboot) marker
# directory used to silence service-down alerts during an active playbook
# run. Global (not role defaults) because playbooks/cluster_health.yml's
# "Exit maintenance mode" play needs mysql_ha_silence_dir even when run
# standalone, without the common role ever having run in that process.
mysql_ha_scripts_dir: /usr/local/lib/mysql-ha-scripts
mysql_ha_silence_dir: /run/mysql-ha-scripts

# Global (not a role default) because playbooks/cluster_health.yml reads
# backups directly off disk here, without the xtrabackup role's own defaults
# ever being loaded when it runs standalone.
xtrabackup_repo_path: /var/lib/xtrabackup

# How stale the most recent successful backup is allowed to be before
# cluster_health.yml reports it unhealthy.
xtrabackup_backup_freshness_hours: 26

# Every DB node holds an identical copy of the data (Galera synchronous
# replication), so there's no need to chase "whichever node is primary" —
# backups just run on one fixed node, chosen to be neither the
# HAProxy-designated write node (db_nodes[0], see haproxy_keepalived) nor
# left undefined. Global (not a role default) because cluster_health.yml
# checks freshness on this node even when it runs standalone, without the
# xtrabackup role ever having executed in that run.
xtrabackup_backup_node: "{{ groups['db_nodes'][1] }}"
