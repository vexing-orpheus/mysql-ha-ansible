---
# =============================================================================
# Global cluster variables — x86_64 only. Non-secret settings live here.
# Credentials (PostgreSQL/PgBouncer/HAProxy/keepalived accounts, the alert
# webhook) are never committed to disk — they're prompted for interactively
# by install.yml's "Collect connection credentials and cluster secrets" play
# (and by playbooks/cluster_health.yml's own prompt when run standalone).
# See README.md.
# =============================================================================

# ── Network ───────────────────────────────────────────────────────────────
# vip_interface: enp1s0        # optional override — auto-detected from each
                                # proxy node's default route if left unset
vip_prefix:    24
ntp_server:    pool.ntp.org

# cluster_vip / app_network / ops_network are prompted for interactively
# instead of living here (see the header note above about credential prompts).

# VRRP: true = unicast (cloud/VMware safe default), false = multicast
keepalived_unicast: true
vrrp_router_id:     51
# vrrp_auth_pass is prompted for interactively — see the header note above.

# ── Cluster identity ─────────────────────────────────────────────────────
patroni_scope:     pg-ha-cluster
etcd_cluster_name: pg-ha-etcd

# ── PostgreSQL ────────────────────────────────────────────────────────────
pg_version: 18                              # override with -e pg_version=16
pg_port:    5432
pg_data_dir: "/var/lib/postgresql/{{ pg_version }}/main"
pg_log_dir:  /var/log/postgresql

# Auto-sized at role runtime from ansible_memtotal_mb; override to pin.
# shared_buffers_override: 8GB
# effective_cache_size_override: 24GB
work_mem: 16MB
maintenance_work_mem: 256MB

random_page_cost: "1.1"                     # NVMe/SSD default
effective_io_concurrency: 200

# ── Ports ─────────────────────────────────────────────────────────────────
patroni_api_port:    8008
etcd_client_port:    2379
etcd_peer_port:      2380
pgbouncer_port:      5433
haproxy_write_port:  5000
haproxy_read_port:   5001
haproxy_stats_port:  7000

# ── PgBouncer tuning ──────────────────────────────────────────────────────
pgbouncer_pool_mode: transaction
pgbouncer_max_client_conn: 1000
pgbouncer_default_pool_size: 20
pgbouncer_min_pool_size: 5
pgbouncer_reserve_pool_size: 5

# ── Backups / archiving / alerts ──────────────────────────────────────────
# Global (not role defaults) because playbooks/cluster_health.yml can run
# standalone, without the pgbackrest role ever having run in that process.
# alert_webhook_url is prompted for interactively — see the header note above.
alert_webhook_payload_key: text   # "text" for Slack, "content" for Discord

# How stale the most recent successful backup is allowed to be before
# cluster_health.yml reports it unhealthy.
pgbackrest_backup_freshness_hours: 26
